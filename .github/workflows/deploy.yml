# GitHub 에 올린 코드를 호스팅(InfinityFree)의 FTP 로 자동 업로드한다.
# 내 컴퓨터에서 파일을 올리지 않아도 된다: GitHub 서버가 대신 올려 준다.
#
# 쓰는 법
#   1) GitHub 저장소 > Settings > Secrets and variables > Actions > "New repository secret" 으로 3개를 만든다
#        FTP_SERVER    InfinityFree 계정 화면의 FTP 호스트 이름
#        FTP_USERNAME  같은 화면의 FTP 사용자 이름 (if0_숫자 형태)
#        FTP_PASSWORD  같은 화면의 FTP 비밀번호 (이 값은 GitHub 의 비밀 저장소에만 입력하고 어디에도 붙여 넣지 않는다)
#   2) 저장소 > Actions 탭 > "호스팅에 배포" > "Run workflow" 를 누른다
#
# 비밀 설정 파일(kakao.php, database.php, site.php)은 저장소에 없으므로 올라가지도, 지워지지도 않는다.
# 처음에는 수동 실행만 되게 해 두었다. 자동으로 하려면 아래 on: 에 push 를 추가한다.
name: 호스팅에 배포

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 로 업로드
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            deploy/**
            tripmate.sql
            README.md
            readme.rst
            license.txt
            composer.json
            .editorconfig
