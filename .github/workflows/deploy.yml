# GitHub 에 올린 코드를 호스팅(InfinityFree)의 FTP 로 자동 업로드한다.
# 내 컴퓨터에서 파일을 올리지 않아도 된다: GitHub 서버가 대신 올려 준다.
#
# 쓰는 법
#   1) GitHub 저장소 > Settings > Secrets and variables > Actions > "New repository secret" 으로 3개를 만든다
#        FTP_SERVER    InfinityFree 계정 화면의 FTP 호스트 이름
#        FTP_USERNAME  같은 화면의 FTP 사용자 이름 (if0_숫자 형태)
#        FTP_PASSWORD  같은 화면의 FTP 비밀번호 (이 값은 GitHub 의 비밀 저장소에만 입력하고 어디에도 붙여 넣지 않는다)
#   2) main 브랜치에 푸시하면 자동으로 배포된다. (직접 하려면 Actions 탭 > "호스팅에 배포" > "Run workflow")
#
# 비밀 설정 파일(kakao.php, database.php, site.php)은 저장소에 없으므로 올라가지도, 지워지지도 않는다.
# DB 표 구조가 바뀌는 변경은 자동으로 반영되지 않는다. 서버 phpMyAdmin 에서 변경 SQL 을 직접 실행해야 한다.
name: 호스팅에 배포

on:
  push:
    branches: [main]
    # 서버 코드에 영향이 없는 변경만 있는 푸시는 배포하지 않는다
    paths-ignore:
      - 'README.md'
      - 'tripmate.sql'
      - 'deploy/**'
      - '.gitignore'
  workflow_dispatch:

# 푸시가 연달아 와도 배포가 동시에 돌지 않게 한다 (FTP 가 서로 엉키지 않도록 줄 세움)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP 로 업로드
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            deploy/**
            tripmate.sql
            README.md
            readme.rst
            license.txt
            composer.json
            .editorconfig
